<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch calendar</title>
    <!-- React, Babel, Tailwind, Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Helvetica', 'Arial', sans-serif; 
            overscroll-behavior-y: contain; /* iPhoneでの引っ張り更新を防止 */
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <meta name="theme-color" content="#09090b">
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div id="root"></div>

    <script>
        if (window.Babel) {
            Babel.registerPreset('watch-react', { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] });
        }
    </script>
    <script type="text/babel" data-presets="watch-react">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- システムデフォルト設定 ---
        const SYSTEM_DEFAULTS = {
            verticalShift: 8,
            sideMargin: 27,
            bottomPadding: 43,
            contentScale: 0.98,
            bgScale: 1.2,
            bgOffset: { x: -95, y: -135 },
            monthPosX: 40,
            monthPosY: 184  // 前回の調整（179から5px下）をデフォルトに
        };

        const Slider = ({ label, value, min, max, step = 1, onChange, onReset, color = "blue" }) => (
            <div className="flex flex-col gap-2 w-full py-1">
                <div className="flex items-center justify-between w-full">
                    <span className="text-[14px] font-bold text-zinc-400">{label}</span>
                    <div className="flex items-center gap-3">
                        <span className={`text-[14px] font-mono font-bold text-${color}-400 text-right`}>
                            {step < 1 ? value.toFixed(2) : value}
                        </span>
                        <button onClick={onReset} className="p-1 hover:bg-zinc-700 rounded-lg transition-colors text-zinc-500 hover:text-white active:scale-90">
                            <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} className="w-full h-1.5 rounded-lg appearance-none cursor-pointer bg-zinc-800" />
            </div>
        );

        const copyPreview = (target, source) => {
            const context = target.getContext('2d');
            context.clearRect(0, 0, source.width, source.height);
            context.drawImage(source, 0, 0);
        };

        const App = () => {
            const STORAGE_KEY = 'watch_calendar_state_v4';
            const DEFAULTS_KEY = 'watch_calendar_user_defaults_v4';
            const canvasRef = useRef(null);
            const previewRenderRef = useRef(null);
            const generatingRef = useRef(false);
            const uploadRef = useRef(null);
            const [yearDraft, setYearDraft] = useState(null);

            const [year, setYear] = useState(new Date().getFullYear());
            const [month, setMonth] = useState(new Date().getMonth() + 1);
            const [userDefaults, setUserDefaults] = useState(SYSTEM_DEFAULTS);
            const [bgImage, setBgImage] = useState(null);
            const [bgScale, setBgScale] = useState(SYSTEM_DEFAULTS.bgScale);
            const [bgOffset, setBgOffset] = useState(SYSTEM_DEFAULTS.bgOffset);
            const [calVerticalShift, setCalVerticalShift] = useState(SYSTEM_DEFAULTS.verticalShift);
            const [calBottomPadding, setCalBottomPadding] = useState(SYSTEM_DEFAULTS.bottomPadding);
            const [calSideMargin, setCalSideMargin] = useState(SYSTEM_DEFAULTS.sideMargin);
            const [calContentScale, setCalContentScale] = useState(SYSTEM_DEFAULTS.contentScale);
            const [monthPosX, setMonthPosX] = useState(SYSTEM_DEFAULTS.monthPosX);
            const [monthPosY, setMonthPosY] = useState(SYSTEM_DEFAULTS.monthPosY);

            const [isDragging, setIsDragging] = useState(false);
            const previewGestureRef = useRef(null);
            const [gestureMode, setGestureMode] = useState('calendar');
            const gestureStateRef = useRef(null);
            gestureStateRef.current = { gestureMode, bgImage, bgScale, bgOffset, calVerticalShift, calBottomPadding, calSideMargin, calContentScale, monthPosX, monthPosY };
            const saveGestureRef = useRef(null);
            const gestureHelp = {
                calendar: '1本指でカレンダーを上下移動・ピンチで文字と行間を拡大縮小',
                width: '左右ドラッグ、またはピンチでカレンダーの横幅を調整',
                month: '1本指で「○月」を上下左右に移動',
                bottom: '上下ドラッグで下端余白を調整（上に動かすと余白が増えます）',
                background: bgImage ? '1本指で背景を移動・ピンチで背景を拡大縮小' : '「画像を選択」で背景画像を読み込んでください'
            };
            const [previewScale, setPreviewScale] = useState(1);
            const [generatedImage, setGeneratedImage] = useState(null);

            const WATCH_WIDTH = 416;
            const WATCH_HEIGHT = 496;
            const FONT_NAME = "Helvetica";

            useEffect(() => {
                const handleResize = () => {
                    const containerWidth = Math.min(window.innerWidth - 32, 416);
                    setPreviewScale(containerWidth / 416);
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                try {
                const savedDefaults = localStorage.getItem(DEFAULTS_KEY);
                if (savedDefaults) try { const d = JSON.parse(savedDefaults); if (d && typeof d === 'object' && !Array.isArray(d)) setUserDefaults({ ...SYSTEM_DEFAULTS, ...d }); } catch(e){}
                const savedState = localStorage.getItem(STORAGE_KEY);
                if (savedState) {
                    try {
                        const d = JSON.parse(savedState);
                        if (d.bgImage) setBgImage(d.bgImage);
                        if (d.bgScale) setBgScale(d.bgScale);
                        if (d.bgOffset) setBgOffset(d.bgOffset);
                        if (d.calVerticalShift !== undefined) setCalVerticalShift(d.calVerticalShift);
                        if (d.calBottomPadding !== undefined) setCalBottomPadding(d.calBottomPadding);
                        if (d.calSideMargin !== undefined) setCalSideMargin(d.calSideMargin);
                        if (d.calContentScale !== undefined) setCalContentScale(d.calContentScale);
                        if (d.monthPosX !== undefined) setMonthPosX(d.monthPosX);
                        if (d.monthPosY !== undefined) setMonthPosY(d.monthPosY);
                    } catch(e){}
                }
                } catch (error) { console.warn('設定を読み込めませんでした', error); }
            }, []);

            const saveSettings = (updates = {}) => {
                const current = { 
                    bgImage, bgScale, bgOffset, calVerticalShift, calBottomPadding, calSideMargin, 
                    calContentScale, monthPosX, monthPosY, ...updates 
                };
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
                } catch (e) {
                    console.error("保存容量の限界です", e);
                }
            };

            saveGestureRef.current = saveSettings;

            const handleSetAsDefault = () => {
                const newD = { 
                    verticalShift: calVerticalShift, sideMargin: calSideMargin, bottomPadding: calBottomPadding, 
                    contentScale: calContentScale, bgScale, bgOffset, monthPosX, monthPosY 
                };
                try {
                    localStorage.setItem(DEFAULTS_KEY, JSON.stringify(newD));
                    setUserDefaults(newD);
                } catch (error) { alert('デフォルトを保存できませんでした。保存領域を確認してください。'); }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const uploadToken = {};
                uploadRef.current = uploadToken;
                const failUpload = () => { if (uploadRef.current === uploadToken) alert('画像を読み込めませんでした。別の画像を選択してください。'); };
                const reader = new FileReader();
                reader.onerror = failUpload;
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onerror = failUpload;
                    img.onload = () => {
                        if (uploadRef.current !== uploadToken) return;
                        try {
                        const MAX_SIZE = 1200;
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width; width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height; height = MAX_SIZE;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.85);
                        setBgImage(compressedData);
                        saveSettings({ bgImage: compressedData });
                        } catch (error) { failUpload(); }
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            const holidays = useMemo(() => {
                const h = new Set();
                const fixed = { 1: [1], 2: [11, 23], 4: [29], 5: [3, 4, 5], 8: [11], 11: [3, 23] };
                if (fixed[month]) fixed[month].forEach(d => h.add(d));
                const getNthMonday = (y, m, n) => {
                    const firstDay = new Date(y, m - 1, 1).getDay();
                    let fm = (firstDay <= 1) ? (1 - firstDay + 1) : (1 - firstDay + 8);
                    return fm + (n - 1) * 7;
                };
                if (month === 1) h.add(getNthMonday(year, 1, 2)); if (month === 7) h.add(getNthMonday(year, 7, 3));
                if (month === 9) h.add(getNthMonday(year, 9, 3)); if (month === 10) h.add(getNthMonday(year, 10, 2));
                if (month === 3) h.add(Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)));
                if (month === 9) h.add(Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)));
                Array.from(h).sort((a, b) => a - b).forEach(d => {
                    if (new Date(year, month - 1, d).getDay() === 0) {
                        let nd = d + 1; while (h.has(nd)) nd++;
                        if (nd <= new Date(year, month, 0).getDate()) h.add(nd);
                    }
                });
                return h;
            }, [year, month]);

            const weeks = useMemo(() => {
                const firstDay = new Date(year, month - 1, 1).getDay();
                const lastDate = new Date(year, month, 0).getDate();
                const days = Array(firstDay).fill(null).concat(Array.from({ length: lastDate }, (_, i) => i + 1));
                const res = []; for (let i = 0; i < days.length; i += 7) res.push(days.slice(i, i + 7));
                return res;
            }, [year, month]);

            const renderCanvas = (showComps = true) => {
                const renderToken = {};
                if (showComps) previewRenderRef.current = renderToken;
                return new Promise((resolve, reject) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = WATCH_WIDTH;
                    canvas.height = WATCH_HEIGHT;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, WATCH_WIDTH, WATCH_HEIGHT);
                    const drawText = () => {
                        const clockLimit = 180, sideMargin = calSideMargin, drawWidth = WATCH_WIDTH - (sideMargin * 2);
                        const safeBottom = 440 - calBottomPadding, areaHeight = safeBottom - clockLimit;
                        const rowHeight = (areaHeight / (weeks.length + 1)) * calContentScale, totalHeight = rowHeight * (weeks.length + 1);
                        const startY = clockLimit + (areaHeight - totalHeight) / 2 + calVerticalShift;
                        
                        ctx.textBaseline = 'alphabetic';

                        if (showComps) {
                            ctx.textAlign = 'right'; ctx.fillStyle = 'white';
                            ctx.font = `400 36px ${FONT_NAME}`; ctx.fillText("3/2(月)", WATCH_WIDTH - 25, 70);
                            ctx.font = `300 110px ${FONT_NAME}`; ctx.fillText("2:31", WATCH_WIDTH - 15, clockLimit);
                            
                            const fixedTopGuide = 197; const fixedBottomGuide = 433; const additionalGuide = 395; 
                            ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)'; ctx.setLineDash([5, 5]); ctx.beginPath();
                            ctx.moveTo(0, fixedTopGuide); ctx.lineTo(WATCH_WIDTH, fixedTopGuide); 
                            ctx.moveTo(0, fixedBottomGuide); ctx.lineTo(WATCH_WIDTH, fixedBottomGuide); 
                            ctx.moveTo(0, additionalGuide); ctx.lineTo(WATCH_WIDTH, additionalGuide);
                            ctx.stroke();
                            
                            ctx.setLineDash([]); ctx.fillStyle = '#CCC'; ctx.font = `400 32px ${FONT_NAME}`; 
                            ctx.textBaseline = 'alphabetic'; 
                            ctx.fillText(`降水 40%`, WATCH_WIDTH - 25, fixedBottomGuide - 3);
                        }
                        
                        // --- 月表示 ---
                        ctx.fillStyle = 'white'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; 
                        ctx.font = `500 ${Math.max(14, Math.floor(49 * calContentScale))}px ${FONT_NAME}`;
                        ctx.fillText(`${month}月`, monthPosX, monthPosY);
                        
                        // --- カレンダー本体 ---
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
                        const colW = drawWidth / 7; 
                        const daysHead = ['日', '月', '火', '水', '木', '金', '土'];
                        const hFontSize = Math.max(14, Math.floor(24 * calContentScale)); 
                        ctx.font = `500 ${hFontSize}px ${FONT_NAME}`;
                        const hY = startY + (rowHeight * 0.5); 
                        daysHead.forEach((d, i) => { 
                            ctx.fillStyle = i === 0 ? '#FF2D55' : i === 6 ? '#007AFF' : '#FFFFFF'; 
                            ctx.fillText(d, sideMargin + i * colW + colW / 2, hY); 
                        });
                        const lY = hY + (hFontSize / 2); 
                        ctx.strokeStyle = 'silver'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sideMargin, lY); ctx.lineTo(WATCH_WIDTH - sideMargin, lY); ctx.stroke();
                        ctx.font = `400 ${Math.max(14, Math.floor(32 * calContentScale))}px ${FONT_NAME}`;
                        weeks.forEach((week, ri) => {
                            const rY = startY + (ri + 1) * rowHeight + (rowHeight * 0.5);
                            week.forEach((day, ci) => { 
                                if (!day) return; 
                                ctx.fillStyle = (ci === 0 || holidays.has(day)) ? '#FF2D55' : ci === 6 ? '#007AFF' : '#FFFFFF';
                                ctx.fillText(day.toString(), sideMargin + ci * colW + colW / 2, rY); 
                            });
                        });
                        if (showComps && previewRenderRef.current === renderToken && canvasRef.current) {
                            copyPreview(canvasRef.current, canvas);
                        }
                        resolve(canvas);
                    };
                    if (bgImage) {
                        const img = new Image();
                        img.onerror = () => reject(new Error('背景画像を読み込めませんでした。'));
                        img.onload = () => {
                            try {
                            const dW = img.width * bgScale, dH = img.height * bgScale;
                            ctx.save();
                            ctx.drawImage(img, (WATCH_WIDTH - dW) / 2 + bgOffset.x, (WATCH_HEIGHT - dH) / 2 + bgOffset.y, dW, dH);
                            ctx.restore(); drawText();
                            } catch (error) { reject(error); }
                        };
                        img.src = bgImage;
                    } else { drawText(); }
                });
            };

            useEffect(() => { renderCanvas(true).catch(error => console.warn('プレビューを描画できませんでした', error)); }, [year, month, bgImage, bgScale, bgOffset, calVerticalShift, calBottomPadding, calSideMargin, calContentScale, monthPosX, monthPosY]);

            const downloadImage = async () => {
                if (generatingRef.current) return;
                generatingRef.current = true;
                try {
                    const canvas = await renderCanvas(false);
                    const dataUrl = canvas.toDataURL('image/png');
                    setGeneratedImage(dataUrl);
                } catch (error) { alert('画像を作成できませんでした。背景画像を選び直してお試しください。'); }
                finally { generatingRef.current = false; }
            };

            // Pointer capture keeps gestures local to the preview, including finger-count changes.
            useEffect(() => {
                const el = previewGestureRef.current;
                const points = new Map();
                let base = null, dirty = {};
                const clamp = (v, min, max, step = 1) => Math.min(max, Math.max(min, Math.round(v / step) * step));
                const measure = () => {
                    const p = [...points.values()];
                    if (p.length === 1) return { x: p[0].x, y: p[0].y, distance: 0 };
                    return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2,
                        distance: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) };
                };
                const rebase = () => { base = points.size ? { ...gestureStateRef.current, ...measure(), count: points.size } : null; };
                const persist = () => {
                    if (Object.keys(dirty).length) saveGestureRef.current(dirty);
                    dirty = {};
                };
                const down = (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    const state = gestureStateRef.current;
                    if (state.gestureMode === 'background' && !state.bgImage) return;
                    if (points.size >= 2) return;
                    points.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    el.setPointerCapture(e.pointerId);
                    rebase(); setIsDragging(true);
                    if (e.cancelable) e.preventDefault();
                };
                const move = (e) => {
                    if (!points.has(e.pointerId)) return;
                    points.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (!base || base.gestureMode !== gestureStateRef.current.gestureMode) rebase();
                    const now = measure();
                    const rect = canvasRef.current.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const dx = (now.x - base.x) * WATCH_WIDTH / rect.width;
                    const dy = (now.y - base.y) * WATCH_HEIGHT / rect.height;
                    const ratio = base.distance > 0 ? now.distance / base.distance : 1;
                    const pinching = base.count === 2;
                    let updates = {};
                    switch (base.gestureMode) {
                        case 'calendar':
                            updates.calVerticalShift = clamp(base.calVerticalShift + dy, -80, 80);
                            if (pinching) updates.calContentScale = clamp(base.calContentScale * ratio, 0.5, 1.5, 0.01);
                            break;
                        case 'width':
                            updates.calSideMargin = clamp(pinching ? (WATCH_WIDTH - (WATCH_WIDTH - base.calSideMargin * 2) * ratio) / 2 : base.calSideMargin - dx / 2, 10, 80);
                            break;
                        case 'month':
                            if (!pinching) {
                                updates.monthPosX = clamp(base.monthPosX + dx, 0, 416);
                                updates.monthPosY = clamp(base.monthPosY + dy, 0, 300);
                            }
                            break;
                        case 'bottom':
                            updates.calBottomPadding = clamp(base.calBottomPadding - dy, 0, 100);
                            break;
                        case 'background':
                            updates.bgOffset = { x: base.bgOffset.x + dx, y: base.bgOffset.y + dy };
                            if (pinching) updates.bgScale = clamp(base.bgScale * ratio, 0.1, 5, 0.01);
                            break;
                    }
                    const setters = { calVerticalShift: setCalVerticalShift, calContentScale: setCalContentScale,
                        calSideMargin: setCalSideMargin, monthPosX: setMonthPosX, monthPosY: setMonthPosY,
                        calBottomPadding: setCalBottomPadding, bgOffset: setBgOffset, bgScale: setBgScale };
                    for (const [key, value] of Object.entries(updates)) setters[key](value);
                    gestureStateRef.current = { ...gestureStateRef.current, ...updates };
                    dirty = { ...dirty, ...updates };
                    if (e.cancelable) e.preventDefault();
                };
                const end = (e) => {
                    if (!points.delete(e.pointerId)) return;
                    rebase(); setIsDragging(points.size > 0); persist();
                };
                const cancel = () => { points.clear(); base = null; setIsDragging(false); persist(); };
                el.addEventListener('pointerdown', down, { passive: false });
                el.addEventListener('pointermove', move, { passive: false });
                el.addEventListener('pointerup', end);
                el.addEventListener('pointercancel', end);
                el.addEventListener('lostpointercapture', end);
                window.addEventListener('blur', cancel);
                return () => {
                    el.removeEventListener('pointerdown', down);
                    el.removeEventListener('pointermove', move);
                    el.removeEventListener('pointerup', end);
                    el.removeEventListener('pointercancel', end);
                    el.removeEventListener('lostpointercapture', end);
                    window.removeEventListener('blur', cancel);
                };
            }, []);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [bgImage, generatedImage]);

            return (
                <div className="p-4 w-full max-w-[1000px] mx-auto flex flex-col items-center gap-6 text-white pb-20">
                    <div className="bg-zinc-900 p-5 sm:p-6 rounded-3xl border border-zinc-800 shadow-2xl w-full max-w-[416px] space-y-5">
                        <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                            <div className="flex items-center gap-2"><i data-lucide="settings-2" className="text-blue-400 w-5 h-5"></i><h1 className="text-[16px] font-bold">Watch calendar</h1></div>
                            <div className="flex gap-2">
                                <button onClick={handleSetAsDefault} className="text-[12px] bg-zinc-800 hover:bg-zinc-700 px-2 py-1.5 rounded-lg text-blue-400 font-bold active:scale-95 transition-all">デフォルト</button>
                                <button onClick={() => { if(confirm("設定をリセットしますか？")) { 
                                    setCalVerticalShift(SYSTEM_DEFAULTS.verticalShift); 
                                    setCalSideMargin(SYSTEM_DEFAULTS.sideMargin); 
                                    setCalBottomPadding(SYSTEM_DEFAULTS.bottomPadding); 
                                    setBgScale(SYSTEM_DEFAULTS.bgScale); 
                                    setBgOffset(SYSTEM_DEFAULTS.bgOffset); 
                                    setMonthPosX(SYSTEM_DEFAULTS.monthPosX); 
                                    setMonthPosY(SYSTEM_DEFAULTS.monthPosY);
                                    setCalContentScale(SYSTEM_DEFAULTS.contentScale);
                                    saveSettings({
                                        calVerticalShift: SYSTEM_DEFAULTS.verticalShift,
                                        calSideMargin: SYSTEM_DEFAULTS.sideMargin,
                                        calBottomPadding: SYSTEM_DEFAULTS.bottomPadding,
                                        calContentScale: SYSTEM_DEFAULTS.contentScale,
                                        bgScale: SYSTEM_DEFAULTS.bgScale,
                                        bgOffset: SYSTEM_DEFAULTS.bgOffset,
                                        monthPosX: SYSTEM_DEFAULTS.monthPosX,
                                        monthPosY: SYSTEM_DEFAULTS.monthPosY
                                    }); 
                                } }} className="text-[12px] bg-zinc-800 hover:bg-zinc-700 px-2 py-1.5 rounded-lg text-zinc-400 active:scale-95 transition-all">リセット</button>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-zinc-800 px-3 py-2 rounded-xl flex items-center gap-2 border border-zinc-700"><label className="text-[14px] text-zinc-500 font-bold">年</label><input type="number" value={yearDraft ?? year} onChange={(e) => {
                                setYearDraft(e.target.value);
                                if (e.target.value !== '' && e.target.validity.valid && Number.isFinite(parseInt(e.target.value))) setYear(parseInt(e.target.value));
                            }} onBlur={() => setYearDraft(null)} className="w-full bg-transparent border-none outline-none text-[14px] font-bold"/></div>
                            <div className="bg-zinc-800 px-3 py-2 rounded-xl flex items-center gap-2 border border-zinc-700"><label className="text-[14px] text-zinc-500 font-bold">月</label><select value={month} onChange={(e) => setMonth(parseInt(e.target.value))} className="w-full bg-transparent border-none outline-none text-[14px] font-bold">{Array.from({ length: 12 }, (_, i) => (<option key={i + 1} value={i + 1} className="bg-zinc-800">{i + 1}月</option>))}</select></div>
                        </div>
                        <div className="bg-black/30 p-4 rounded-2xl border border-zinc-800 space-y-3">
                            <Slider label="カレンダー上下" value={calVerticalShift} min={-80} max={80} onChange={(v) => { setCalVerticalShift(v); saveSettings({ calVerticalShift: v }); }} onReset={() => { setCalVerticalShift(userDefaults.verticalShift ?? SYSTEM_DEFAULTS.verticalShift); saveSettings({ calVerticalShift: userDefaults.verticalShift ?? SYSTEM_DEFAULTS.verticalShift }); }} />
                            <Slider label="カレンダー左右" value={calSideMargin} min={10} max={80} onChange={(v) => { setCalSideMargin(v); saveSettings({ calSideMargin: v }); }} onReset={() => { setCalSideMargin(userDefaults.sideMargin ?? SYSTEM_DEFAULTS.sideMargin); saveSettings({ calSideMargin: userDefaults.sideMargin ?? SYSTEM_DEFAULTS.sideMargin }); }} />
                            
                            <div className="pt-2 border-t border-zinc-800/50 mt-1">
                                <Slider label="月・横位置" value={monthPosX} min={0} max={416} onChange={(v) => { setMonthPosX(v); saveSettings({ monthPosX: v }); }} onReset={() => { setMonthPosX(userDefaults.monthPosX ?? SYSTEM_DEFAULTS.monthPosX); saveSettings({ monthPosX: userDefaults.monthPosX ?? SYSTEM_DEFAULTS.monthPosX }); }} color="blue" />
                                <Slider label="月・縦位置" value={monthPosY} min={0} max={300} onChange={(v) => { setMonthPosY(v); saveSettings({ monthPosY: v }); }} onReset={() => { setMonthPosY(userDefaults.monthPosY ?? SYSTEM_DEFAULTS.monthPosY); saveSettings({ monthPosY: userDefaults.monthPosY ?? SYSTEM_DEFAULTS.monthPosY }); }} color="blue" />
                            </div>

                            <Slider label="下端余白" value={calBottomPadding} min={0} max={100} onChange={(v) => { setCalBottomPadding(v); saveSettings({ calBottomPadding: v }); }} onReset={() => { setCalBottomPadding(userDefaults.bottomPadding ?? SYSTEM_DEFAULTS.bottomPadding); saveSettings({ calBottomPadding: userDefaults.bottomPadding ?? SYSTEM_DEFAULTS.bottomPadding }); }} color="red" />
                            {bgImage && <Slider label="ズーム" value={bgScale} min={0.1} max={5} step={0.01} onChange={(v) => { setBgScale(v); saveSettings({ bgScale: v }); }} onReset={() => { setBgScale(userDefaults.bgScale ?? SYSTEM_DEFAULTS.bgScale); saveSettings({ bgScale: userDefaults.bgScale ?? SYSTEM_DEFAULTS.bgScale }); }} color="zinc" />}
                        </div>
                    </div>

                    <div className="flex flex-col items-center w-full max-w-[416px]">
                        <div className="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-3 mb-4">
                            <p className="text-[14px] font-bold mb-2">指で調整する対象</p>
                            <div className="flex flex-wrap gap-2" role="group" aria-label="指で調整する対象">
                                {[['calendar', 'カレンダー'], ['width', '横幅'], ['month', '月の位置'], ['bottom', '下端余白'], ['background', '背景']].map(([mode, label]) => (
                                    <button key={mode} type="button" aria-pressed={gestureMode === mode} onClick={() => setGestureMode(mode)} className={`px-3 py-2 rounded-xl text-[14px] font-bold border ${gestureMode === mode ? 'bg-blue-600 border-blue-400 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-300'}`}>{label}</button>
                                ))}
                            </div>
                            <p className="text-[14px] text-zinc-300 mt-2 leading-relaxed" aria-live="polite">{gestureHelp[gestureMode]}</p>
                            <p className="text-[14px] text-zinc-500 mt-1">下の時計プレビューを指で操作してください。スライダーも使えます。</p>
                        </div>
                        <div style={{ height: `${WATCH_HEIGHT * previewScale}px`, width: `${WATCH_WIDTH * previewScale}px` }} className="relative mb-4">
                            <div ref={previewGestureRef} aria-label="時計壁紙の調整プレビュー" className={`absolute top-0 left-0 w-[416px] h-[496px] group ${isDragging ? 'cursor-grabbing' : 'cursor-grab'} touch-none origin-top-left rounded-[64px]`} style={{ transform: `scale(${previewScale})`, touchAction: 'none' }}>
                                <div className="absolute -inset-4 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                <div className="relative p-2 bg-gradient-to-b from-zinc-700 to-zinc-900 rounded-[64px] shadow-2xl overflow-hidden w-full h-full">
                                    <div className="relative bg-black rounded-[56px] overflow-hidden border-[6px] border-zinc-900 shadow-inner w-full h-full">
                                        <canvas ref={canvasRef} width={WATCH_WIDTH} height={WATCH_HEIGHT} className="block pointer-events-none w-full h-full"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-3 w-full px-2 sm:px-0">
                            <label className="relative flex-1 flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl border border-zinc-700 text-[14px] font-bold shadow-lg text-zinc-300 cursor-pointer active:scale-95 transition-all overflow-hidden text-center">
                                <span>画像を選択</span>
                                <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onChange={handleImageUpload} onClick={(e) => { e.target.value = null; }} />
                            </label>
                            <button onClick={downloadImage} className="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-[14px] shadow-xl active:scale-95 transition-all text-white">画像を作成する</button>
                        </div>
                    </div>

                    {generatedImage && (
                        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95 p-4 touch-none">
                            <p className="text-white mb-6 font-bold text-[18px] text-center leading-relaxed bg-black/50 p-4 rounded-2xl">画像を長押しして<br />「"写真"に保存」を選択してください</p>
                            <img src={generatedImage} className="max-h-[60vh] max-w-full object-contain rounded-[56px] border-[6px] border-zinc-800 shadow-2xl pointer-events-auto" />
                            <button onClick={() => setGeneratedImage(null)} className="mt-8 px-10 py-4 bg-zinc-800 rounded-full font-bold text-white border border-zinc-700 active:scale-95 transition-all">閉じる</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
                .then(function (registration) { return registration.update(); })
                .catch(function (error) { console.warn('PWA update:', error); });
        });
    }
    </script>
</body>
</html>
